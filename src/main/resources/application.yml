# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CDE_BATCH_)
    database-change-log-table: cde_databasechangelog
    database-change-log-lock-table: cde_databasechangeloglock

dcre:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  flow-dc: ${DCRE_FLOW_DC:true}
  batch:
    table-prefix: CDE_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}

  cde:
    # R-38 2nd amendment: candidate = collection date + lead, then the final roll.
    # Lead-then-roll is the R-35 SYNTHETIC-CONTRACT placeholder for the unrecovered
    # collection-cycle rule (A-3); must be >= 1 so process date follows collection date.
    processing-lead-days: ${DCRE_CDE_PROCESSING_LEAD_DAYS:2}
    # Holiday-calendar country for the R-38 roll (public_holiday is synced by dcre-hcs)
    country: ${DCRE_CDE_COUNTRY:ZA}
