# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CDE_BATCH_)
    database-change-log-table: cde_databasechangelog
    database-change-log-lock-table: cde_databasechangeloglock

dcre:
  # Telemetry marker, read by platform-batch. Everything else about telemetry (the service name,
  # the instance id, the export flag, the flush, the log appender and the trace context) is
  # resolved inside the library, so this file carries no telemetry configuration of its own and
  # cannot drift from its 29 siblings.
  #
  # Disabled by default: a service run outside the orchestrator behaves exactly as before, and a
  # fresh clone runs with no .env at all (12FactorApp Alignment, https://12factor.net/).
  telemetry:
    enabled: ${DCRE_TELEMETRY_ENABLED:false}
    # OPTIONAL override. Left unset, the library takes this service's own application package
    # leaf, so no service restates its own name here.
    stage: ${DCRE_TELEMETRY_STAGE:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  batch:
    table-prefix: CDE_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}

  cde:
    # R-38 2nd amendment: candidate = collection date + lead, then the final roll.
    # Lead-then-roll is the R-35 SYNTHETIC-CONTRACT placeholder for the unrecovered
    # collection-cycle rule (A-3); must be >= 1 so process date follows collection date.
    processing-lead-days: ${DCRE_CDE_PROCESSING_LEAD_DAYS:2}
    # Holiday-calendar country for the R-38 roll (the calendar is synced by dcre-hcs)
    country: ${DCRE_CDE_COUNTRY:ZA}
    # Second, READ-ONLY connection to the HCS-owned calendar in dcre_hcs (R-04/R-10).
    # The calendar used to live in dcre_col and CDE created it there itself; the owner
    # ruled that out on 2026-08-08 as a 12FactorApp/SOLID violation, so CDE now reads
    # the published hol_cde_view in another context's database and creates nothing.
    # NOT the primary spring.datasource.* creds, so the standing-cluster cde role holds
    # only SELECT on hol_cde_view.
    # The localhost default is the clean-clone dev target ONLY: HolidaysDatasourceConfig
    # makes it fatal at startup inside a pod, which is the lesson from the CTV projection
    # gate that shipped with nothing setting its URL and quietly aimed at localhost.
    # Keep this literal in step with HolidaysDatasourceConfig.LOCAL_DEV_URL (parity-tested).
    holidays-db-url: ${DCRE_CDE_HOLIDAYS_DB_URL:jdbc:postgresql://localhost:26257/dcre_hcs?sslmode=disable}
    holidays-db-user: ${DCRE_CDE_HOLIDAYS_DB_USER:root}
    holidays-db-password: ${DCRE_CDE_HOLIDAYS_DB_PASSWORD:}
